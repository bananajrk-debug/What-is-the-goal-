<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
html,body{margin:0;background:#10131a;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#wrap{position:relative;width:720px;max-width:100%}
canvas{display:block;width:100%;height:auto;background:#000;border:2px solid #333;border-radius:4px}

/* ---- ロビー画面 ---- */
#lobby-overlay{position:absolute;inset:0;background:rgba(10,12,20,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.lobby-title{font-size:36px;font-weight:900;margin-bottom:20px;color:#ffd54f;text-shadow:0 0 12px rgba(255,213,79,.4);letter-spacing:2px}

.menu-grid{display:flex;flex-direction:column;gap:12px;width:280px;margin-bottom:15px}
.menu-btn{font-size:16px;font-weight:bold;padding:12px;border-radius:8px;border:0;background:#ffd54f;color:#111;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.menu-btn:hover{background:#ffe082;transform:translateY(-1px)}
.menu-btn.disabled{background:#333a48;color:#778294;cursor:not-allowed;transform:none}

#room-panel{display:none;flex-direction:column;align-items:center;gap:12px;background:rgba(255,255,255,.05);padding:18px;border-radius:12px;border:1px solid #333a48;width:300px}
.join-row{display:flex;gap:8px;width:100%}
input{font-size:16px;padding:8px 12px;border-radius:6px;border:1px solid #444;background:#181c26;color:#fff;width:120px;text-align:center;letter-spacing:3px}
.sub-btn{font-size:15px;padding:8px 14px;border-radius:6px;border:0;background:#4fc3f7;color:#000;font-weight:bold;cursor:pointer}
.back-btn{font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid #555;background:transparent;color:#ccc;cursor:pointer;margin-top:4px}

#st{min-height:20px;font-size:13px;color:#9fd;text-align:center;margin-top:8px}
p.guide{font-size:12px;color:#889;margin:8px 0 0;text-align:center}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="720" height="540"></canvas>
  
  <div id="lobby-overlay">
    <div class="lobby-title">なにが目的なん？</div>
    
    <div id="main-menu" class="menu-grid">
      <button class="menu-btn" onclick="playSE('click'); showRoomPanel()">🏁 オンライン対戦</button>
      <button class="menu-btn disabled" title="準備中">🛒 アイテムショップ <small>(準備中)</small></button>
      <button class="menu-btn disabled" title="準備中">🔧 自転車修理ラボ <small>(準備中)</small></button>
    </div>

    <div id="room-panel">
      <button class="menu-btn" style="width:100%" id="create">新規ルーム作成</button>
      <div class="join-row">
        <input id="code" maxlength="6" placeholder="6桁コード" inputmode="numeric">
        <button class="sub-btn" id="join">参加</button>
      </div>
      <button class="back-btn" onclick="playSE('click'); showMainMenu()">← メインメニューに戻る</button>
    </div>

    <div id="st"></div>
  </div>
</div>

<p class="guide">左右：A / D または ← / → ｜ アクション(急ブレーキ・ブースト)：W / ↑ / Space ｜ 再戦：Enter</p>

<script src="/socket.io/socket.io.js"></script>
<script>
// ---- Web Audio API 効果音合成エンジン ----
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSE(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
      gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.05);
    } 
    else if (type === 'brake') {
      const bufferSize = audioCtx.sampleRate * 0.3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(1200, now); filter.Q.setValueAtTime(3, now);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(now);
    } 
    else if (type === 'boost') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.4);
      gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.4);
    } 
    else if (type === 'crash') {
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, now); filter.frequency.linearRampToValueAtTime(100, now + 0.5);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.7, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(now);
    } 
    else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.2, now + idx * 0.08); gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.2);
      });
    } 
    else if (type === 'siren') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.linearRampToValueAtTime(600, now + 0.2); osc.frequency.linearRampToValueAtTime(900, now + 0.4);
      gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.4);
    }
  } catch(e) {}
}

const socket = io(), cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = 720, H = 540;
const $ = id => document.getElementById(id), COL = ['#4fc3f7', '#ffb74d'], CAR = ['#c33', '#3a6', '#58c', '#c9a', '#999'];
const HY = 170, GY = 540, K = 1.9;
let slot = 0, S = null, D = null, inGame = false, last = { l: 0, r: 0 };

function showRoomPanel() { $('main-menu').style.display = 'none'; $('room-panel').style.display = 'flex';$('st').textContent = ''; }
function showMainMenu() { $('main-menu').style.display = 'flex'; $('room-panel').style.display = 'none';$('st').textContent = ''; }

$('create').onclick = () => { playSE('click'); socket.emit('create', r => {$('st').textContent = 'ルームコード: ' + r.code + ' （相手の参加を待っています…）'; }); };
$('join').onclick = () => { playSE('click'); socket.emit('join', $('code').value.trim(), r => { if (!r.ok)$('st').textContent = r.err; }); };

socket.on('start', d => {
  slot = d.slot; inGame = true; S = D = null;
  $('lobby-overlay').style.display = 'none';
  playSE('win');
});
socket.on('left', () => {
  inGame = false; S = D = null;
  $('lobby-overlay').style.display = 'flex';
  showMainMenu();
  $('st').textContent = '相手が退出しました';
});

let lastEventProcessed = null;
socket.on('st', s => {
  S = s;
  if (S.lastAct) playSE(S.lastAct);
  if (S.lastEvent && S.lastEvent !== lastEventProcessed) {
    playSE(S.lastEvent);
    lastEventProcessed = S.lastEvent;
  }
});

const keys = {};
function sendInp() {
  const l = +!!(keys.KeyA || keys.ArrowLeft), r = +!!(keys.KeyD || keys.ArrowRight);
  if (l !== last.l || r !== last.r) { last = { l, r }; socket.emit('inp', { l, r }); }
}
addEventListener('keydown', e => {
  initAudio();
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) socket.emit('act');
    if (e.code === 'Enter') socket.emit('again');
  }
  keys[e.code] = true; sendInp();
});
addEventListener('keyup', e => { keys[e.code] = false; sendInp(); });

function sync(dt) {
  if (!S) return;
  if (!D || S.s === 'count' || S.rd !== D.rd) { D = JSON.parse(JSON.stringify(S)); return; }
  const k = Math.min(1, dt * 18), old = {}; D.obs.forEach(o => old[o.id] = o);
  const P = S.P.map((t, i) => {
    const c = D.P[i]; if (!t) return null; if (!c) return t;
    c.x += (t.x - c.x) * k; c.z += (t.z - c.z) * k; c.v = t.v; c.brk = t.brk; c.brakes = t.brakes; c.boost = t.boost; c.cd = t.cd; return c;
  });
  const obs = S.obs.map(o => { const c = old[o.id]; if (!c) return { ...o }; c.x += (o.x - c.x) * k; c.z += (o.z - c.z) * k; return c; });
  Object.assign(D, { s: S.s, t: S.t, rd: S.rd, att: S.att, sc: S.sc, hist: S.hist, msg: S.msg, sub: S.sub, el: S.el, P, obs, sound: S.sound });
}

function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }

function bike(X, Y, s, col, p) {
  const k = s * K * 22;
  if (p.boost) { ctx.fillStyle = 'rgba(255,230,80,.35)'; ctx.beginPath(); ctx.arc(X, Y - k * 2.5, k * 2.2, 0, 7); ctx.fill(); }
  ctx.fillStyle
