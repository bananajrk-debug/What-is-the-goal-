<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
html,body{margin:0;padding:0;background:#0f1115;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;height:100vh;}
#wrap{position:relative;width:720px;height:540px;max-width:100%;background:#000;border:2px solid #222;box-shadow:0 0 40px rgba(0,0,0,0.8);}
canvas{display:block;width:100%;height:100%;}

/* UI Elements */
#lobby-overlay{position:absolute;inset:0;background:radial-gradient(circle at center, #1a1e29 0%, #0b0d12 100%);display:flex;flex-direction:column;z-index:10;}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 90px 15px 30px;border-bottom:1px solid rgba(255,255,255,0.05);}
.logo{font-family:'Teko',sans-serif;font-size:32px;font-weight:700;color:#ff4655;letter-spacing:2px;line-height:1;}
.nav{display:flex;gap:30px;}
.nav-item{font-weight:bold;font-size:14px;color:#8b97a3;cursor:pointer;transition:0.2s;}
.nav-item.active{color:#fff;border-bottom:2px solid #ff4655;padding-bottom:4px;}

.main-content{flex:1;display:flex;flex-direction:column;position:relative;padding:40px;}
.bg-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Teko',sans-serif;font-size:120px;font-weight:700;color:rgba(255,255,255,0.02);white-space:nowrap;pointer-events:none;}

.menu-area{position:absolute;bottom:40px;right:40px;display:flex;flex-direction:column;align-items:flex-end;gap:15px;}
.btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;font-weight:bold;padding:12px 24px;cursor:pointer;transition:0.2s;display:flex;align-items:center;gap:10px;}
.btn:hover{background:rgba(255,255,255,0.2);}
.btn-play{background:#ff4655;border:none;color:#fff;font-size:24px;font-weight:900;padding:15px 40px;clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);letter-spacing:1px;}
.btn-play:hover{background:#ff5e6b;transform:translateY(-2px);}

#room-panel{display:none;flex-direction:column;align-items:flex-end;gap:10px;background:rgba(0,0,0,0.6);padding:20px;border-left:4px solid #ff4655;}
.input-row{display:flex;gap:8px;}
input[type="text"]{background:#111;border:1px solid #444;color:#fff;font-size:16px;padding:10px;width:120px;text-align:center;letter-spacing:4px;}
input[type="text"]:focus{outline:none;border-color:#ff4655;}

#st{color:#4fc3f7;font-size:14px;margin-top:10px;text-align:right;}
p.guide{position:absolute;bottom:-35px;left:0;width:100%;font-size:12px;color:#889;text-align:center;}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="720" height="540"></canvas>
  
  <div id="lobby-overlay">
    <div class="header">
      <div class="logo">NANIGA MOKUTEKINAN?</div>
      <div class="nav">
        <div class="nav-item active">PLAY</div>
      </div>
      <div style="font-size:13px;color:#8b97a3">🚴 Player</div>
    </div>
    
    <div class="main-content">
      <div class="bg-title">CHASE OR BE CHASED</div>
      
      <div class="menu-area">
        <div id="main-menu" style="display:flex;flex-direction:column;gap:15px;align-items:flex-end;">
          <button class="btn btn-play" id="btn-solo">▶ VS NPC (ソロ)</button>
          <button class="btn" onclick="showRoomPanel()">🌐 フレンドと対戦</button>
        </div>

        <div id="room-panel">
          <button class="btn" style="width:100%;justify-content:center" id="create">新規ルーム作成</button>
          <div class="input-row">
            <input type="text" id="code" maxlength="6" placeholder="6桁コード" inputmode="numeric">
            <button class="btn" style="background:#4fc3f7;color:#000;border:none;" id="join">参加</button>
          </div>
          <button class="btn" style="font-size:12px;padding:6px 12px;background:transparent;border:none;color:#888;" onclick="showMainMenu()">キャンセル</button>
          <div id="st"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<p class="guide">左右:A/D or ←/→ ｜ アクション:W / ↑ / Space ｜ 終了:Esc</p>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 720, H = 540;
const $ = id => document.getElementById(id);
const COL = ['#4fc3f7', '#ff4655'];

let slot = 0, S = null, inGame = false;
let last = { l: 0, r: 0 };

function showRoomPanel() { $('main-menu').style.display = 'none'; $('room-panel').style.display = 'flex'; $('st').textContent = ''; }
function showMainMenu() { $('main-menu').style.display = 'flex'; $('room-panel').style.display = 'none'; $('st').textContent = ''; }

$('btn-solo').onclick = () => {
  socket.emit('joinBot', res => {
    if (res && !res.ok) alert(res.err);
  });
};

$('create').onclick = () => {
  socket.emit('create', res => {
    if (res && res.code) $('st').textContent = 'コード: ' + res.code + ' (対戦相手待ち)';
  });
};

$('join').onclick = () => {
  const codeVal = $('code').value.trim();
  if (!codeVal) return;
  socket.emit('join', codeVal, res => {
    if (res && !res.ok) $('st').textContent = res.err;
  });
};

socket.on('start', d => {
  slot = d.slot;
  inGame = true;
  $('lobby-overlay').style.display = 'none';
});

socket.on('left', () => {
  if (inGame) {
    alert('相手が退出しました');
    inGame = false;
    $('lobby-overlay').style.display = 'flex';
    showMainMenu();
  }
});

socket.on('st', s => { S = s; });

const keys = {};
function sendInp() {
  const l = +!!(keys.KeyA || keys.ArrowLeft);
  const r = +!!(keys.KeyD || keys.ArrowRight);
  if (l !== last.l || r !== last.r) {
    last = { l, r };
    socket.emit('inp', { l, r });
  }
}

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) socket.emit('act');
  }
  keys[e.code] = true;
  sendInp();
});

addEventListener('keyup', e => {
  keys[e.code] = false;
  sendInp();
});

function draw() {
  ctx.fillStyle = '#0f1115';
  ctx.fillRect(0, 0, W, H);

  if (!inGame || !S || !S.P) return;

  const me = S.P[slot];
  if (!me) return;

  // コース描画
  ctx.fillStyle = '#222';
  ctx.fillRect(100, 0, 520, H);

  // プレイヤー描画
  S.P.forEach((p, idx) => {
    if (!p) return;
    const px = W / 2 + p.x;
    const py = H / 2 - (p.z - me.z) * 0.5;

    ctx.fillStyle = COL[idx];
    ctx.beginPath();
    ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fill();
  });

  // テキスト描画
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  if (S.s === 'count') {
    ctx.fillText('カウントダウン: ' + Math.ceil(S.t), W / 2, 80);
  } else if (S.s === 'result') {
    ctx.fillText(S.msg, W / 2, 80);
  }
}

(function loop() {
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
