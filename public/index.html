<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
html,body{margin:0;background:#10131a;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#wrap{position:relative;max-width:100%}
canvas{display:block;max-width:100%;height:auto;background:#000;border:2px solid #333}
#lobby{position:absolute;inset:0;background:rgba(10,12,20,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
h1{margin:0 0 6px;font-size:38px}
button,input{font-size:18px;padding:10px 16px;border-radius:8px;border:0}
button{background:#ffd54f;font-weight:bold;cursor:pointer}
button.solo{background:#81c784}
input{width:150px;text-align:center;letter-spacing:4px}
#st{min-height:24px;color:#9fd}
p{font-size:13px;color:#aab;margin:8px 12px;text-align:center}
</style></head><body>
<div id="wrap"><canvas id="c" width="720" height="540"></canvas>
<div id="lobby"><h1>なにが目的なん？</h1>
<button id="solo" class="solo">ソロ（CPU対戦）</button>
<button id="create">ルーム作成</button>
<div><input id="code" maxlength="6" placeholder="6桁コード" inputmode="numeric"> <button id="join">参加</button></div>
<div id="st"></div></div></div>
<p>左右：A / D または ← / →  アクション(急ブレーキ・ブースト)：W / ↑ / Space  再戦：Enter  ロビーへ戻る：Esc</p>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(),cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=720,H=540;
const $=id=>document.getElementById(id),COL=['#4fc3f7','#ffb74d'],CAR=['#c33','#3a6','#58c','#c9a','#999'];
const HY=170,GY=540,K=1.9,ROAD_W=75;
let slot=0,S=null,D=null,inGame=false,last={l:0,r:0};

function returnLobby(){
  socket.emit('leave');
  inGame=false;S=D=null;
  $('lobby').style.display='flex';$('st').textContent='';
}

$('solo').onclick=()=>socket.emit('solo');
$('create').onclick=()=>socket.emit('create',r=>{$('st').textContent='ルームコード: '+r.code+'  （相手の参加を待っています…）';});
$('join').onclick=()=>socket.emit('join',$('code').value.trim(),r=>{if(!r.ok)$('st').textContent=r.err;});
socket.on('start',d=>{slot=d.slot;inGame=true;S=D=null;$('lobby').style.display='none';});
socket.on('left',()=>{returnLobby();$('st').textContent='相手が退出しました';});
socket.on('st',s=>{S=s;});
const keys={};
function sendInp(){const l=+!!(keys.KeyA||keys.ArrowLeft),r=+!!(keys.KeyD||keys.ArrowRight);
  if(l!==last.l||r!==last.r){last={l,r};socket.emit('inp',{l,r});}}
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code]){
    if(['KeyW','ArrowUp','Space'].includes(e.code))socket.emit('act');
    if(e.code==='Enter')socket.emit('again');
    if(e.code==='Escape')returnLobby();
  }
  keys[e.code]=true;sendInp();});
addEventListener('keyup',e=>{keys[e.code]=false;sendInp();});

cv.addEventListener('click',e=>{
  if(!inGame||!D||D.s!=='match')return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const y=(e.clientY-rect.top)*(H/rect.height);
  if(y>=310&&y<=345){
    if(x>=W/2-180&&x<=W/2-20)socket.emit('again');
    if(x>=W/2+20&&x<=W/2+180)returnLobby();
  }
});

// ---- スナップショットの平滑化 ----
function sync(dt){
  if(!S)return;
  if(!D||S.s==='count'||S.rd!==D.rd){D=JSON.parse(JSON.stringify(S));return;}
  const k=Math.min(1,dt*18),old={};D.obs.forEach(o=>old[o.id]=o);
  const P=S.P.map((t,i)=>{const c=D.P[i];if(!t)return null;if(!c)return t;
    c.x+=(t.x-c.x)*k;c.z+=(t.z-c.z)*k;c.v=t.v;c.brk=t.brk;c.brakes=t.brakes;c.boost=t.boost;c.cd=t.cd;return c;});
  const obs=S.obs.map(o=>{const c=old[o.id];if(!c)return{...o};c.x+=(o.x-c.x)*k;c.z+=(o.z-c.z)*k;return c;});
  Object.assign(D,{s:S.s,t:S.t,rd:S.rd,att:S.att,sc:S.sc,hist:S.hist,msg:S.msg,sub:S.sub,el:S.el,P,obs,bgGap:S.bgGap,bgBx:S.bgBx,bgBoost:S.bgBoost});
}

// ---- 描画 ----
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath
