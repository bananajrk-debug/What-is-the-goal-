<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
html,body{margin:0;padding:0;background:#0f1115;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;height:100vh;}
#wrap{position:relative;width:720px;height:540px;max-width:100%;background:#000;border:2px solid #222;box-shadow:0 0 40px rgba(0,0,0,0.8);}
canvas{display:block;width:100%;height:100%;}

/* UI Overlay */
#lobby-overlay{position:absolute;inset:0;background:radial-gradient(circle at center, #1a1e29 0%, #0b0d12 100%);display:flex;flex-direction:column;z-index:10;}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;border-bottom:1px solid rgba(255,255,255,0.05);}
.logo{font-family:'Teko',sans-serif;font-size:32px;font-weight:700;color:#ff4655;letter-spacing:2px;line-height:1;}

.main-content{flex:1;display:flex;flex-direction:column;position:relative;padding:40px;}
.bg-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Teko',sans-serif;font-size:100px;font-weight:700;color:rgba(255,255,255,0.03);white-space:nowrap;pointer-events:none;}

.menu-area{position:absolute;bottom:40px;right:40px;display:flex;flex-direction:column;align-items:flex-end;gap:15px;}
.btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;font-weight:bold;padding:12px 24px;cursor:pointer;transition:0.2s;}
.btn:hover{background:rgba(255,255,255,0.2);}
.btn-play{background:#ff4655;border:none;color:#fff;font-size:22px;font-weight:900;padding:14px 36px;clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);}
.btn-play:hover{background:#ff5e6b;}

#room-panel{display:none;flex-direction:column;align-items:flex-end;gap:10px;background:rgba(0,0,0,0.6);padding:20px;border-left:4px solid #ff4655;}
.input-row{display:flex;gap:8px;}
input[type="text"]{background:#111;border:1px solid #444;color:#fff;font-size:16px;padding:8px;width:120px;text-align:center;}
#st{color:#4fc3f7;font-size:14px;margin-top:6px;}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="720" height="540"></canvas>
  
  <div id="lobby-overlay">
    <div class="header">
      <div class="logo">NANIGA MOKUTEKINAN?</div>
      <div style="font-size:13px;color:#8b97a3">🚴 ONLINE CHASE</div>
    </div>
    
    <div class="main-content">
      <div class="bg-title">CHASE OR BE CHASED</div>
      
      <div class="menu-area">
        <div id="main-menu" style="display:flex;flex-direction:column;gap:12px;align-items:flex-end;">
          <button class="btn btn-play" id="btn-solo">▶ VS NPC (ソロ)</button>
          <button class="btn" onclick="showRoomPanel()">🌐 フレンドと対戦</button>
        </div>

        <div id="room-panel">
          <button class="btn" style="width:100%;" id="create">新規ルーム作成</button>
          <div class="input-row">
            <input type="text" id="code" maxlength="6" placeholder="6桁コード">
            <button class="btn" style="background:#4fc3f7;color:#000;border:none;" id="join">参加</button>
          </div>
          <button class="btn" style="font-size:12px;padding:4px 8px;background:transparent;border:none;color:#888;" onclick="showMainMenu()">戻る</button>
          <div id="st"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 720, H = 540;
const $ = id => document.getElementById(id);
const COL = ['#4fc3f7', '#ff4655'];

let slot = 0, S = null, inGame = false;
let last = { l: 0, r: 0 };

function showRoomPanel() { $('main-menu').style.display = 'none'; $('room-panel').style.display = 'flex';$('st').textContent = ''; }
function showMainMenu() { $('main-menu').style.display = 'flex'; $('room-panel').style.display = 'none';$('st').textContent = ''; }

$('btn-solo').onclick = () => socket.emit('joinBot', res => { if (res && !res.ok) alert(res.err); });
$('create').onclick = () => socket.emit('create', res => { if (res && res.code)$('st').textContent = 'コード: ' + res.code + ' (対戦相手待ち)'; });
$('join').onclick = () => {
  const codeVal = $('code').value.trim();
  if (codeVal) socket.emit('join', codeVal, res => { if (res && !res.ok) $('st').textContent = res.err; });
};

socket.on('start', d => { slot = d.slot; inGame = true; $('lobby-overlay').style.display = 'none'; });
socket.on('left', () => {
  if (inGame) {
    alert('相手が退出しました');
    inGame = false;
    $('lobby-overlay').style.display = 'flex';
    showMainMenu();
  }
});
socket.on('st', s => { S = s; });

const keys = {};
function sendInp() {
  const l = +!!(keys.KeyA || keys.ArrowLeft);
  const r = +!!(keys.KeyD || keys.ArrowRight);
  if (l !== last.l || r !== last.r) {
    last = { l, r };
    socket.emit('inp', { l, r });
  }
}

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) socket.emit('act');
  }
  keys[e.code] = true;
  sendInp();
});

addEventListener('keyup', e => {
  keys[e.code] = false;
  sendInp();
});

function draw() {
  ctx.fillStyle = '#0f1115';
  ctx.fillRect(0, 0, W, H);

  if (!inGame || !S || !S.P) return;

  const me = S.P[slot];
  if (!me) return;

  // 【追加要素1】道路の幅を半分に変更（520px -> 260px）
  const roadW = 260;
  const roadX = (W - roadW) / 2;
  
  // 道路アスファルト
  ctx.fillStyle = '#1e232d';
  ctx.fillRect(roadX, 0, roadW, H);

  // ガードレール/白線
  ctx.fillStyle = '#ff4655';
  ctx.fillRect(roadX - 6, 0, 6, H);
  ctx.fillRect(roadX + roadW, 0, 6, H);
  
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(roadX + 4, 0, 4, H);
  ctx.fillRect(roadX + roadW - 8, 0, 4, H);

  // センターライン（動的流れ表現）
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  const offset = (me.z % 60);
  for (let y = -60; y < H; y += 60) {
    ctx.fillRect(W / 2 - 2, y + offset, 4, 30);
  }

  // 障害物の描画
  if (S.obs) {
    S.obs.forEach(o => {
      const px = W / 2 + o.x;
      const py = H / 2 - (o.z - me.z) * 0.8;
      if (py > -50 && py < H + 50) {
        ctx.fillStyle = o.type === 'oil' ? '#111' : '#ff9800';
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  // プレイヤー描画
  S.P.forEach((p, idx) => {
    if (!p) return;
    const px = W / 2 + p.x;
    const py = H / 2 - (p.z - me.z) * 0.8;

    // 【追加要素3】ブースト中の視認エフェクト（オーラ＆炎）
    if (p.boost) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 235, 59, 0.4)';
      ctx.beginPath();
      ctx.arc(px, py, 26, 0, Math.PI * 2);
      ctx.fill();

      // ブースト軌跡（後ろに伸びる光）
      ctx.fillStyle = 'rgba(255, 87, 34, 0.6)';
      ctx.beginPath();
      ctx.moveTo(px - 10, py);
      ctx.lineTo(px + 10, py);
      ctx.lineTo(px, py + 35);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 急ブレーキ（赤点滅・煙エフェクト）
    if (p.brk) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(px + (Math.random() - 0.5) * 10, py + 15, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // 本体（バイク/自転車）
    ctx.fillStyle = COL[idx];
    ctx.beginPath();
    ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fill();

    // ブースト文字（両プレイヤーから確認可能）
    if (p.boost) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = '900 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡ BOOST!', px, py - 22);
    }
  });

  // UI・カウントダウン・ロック表示
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  
  if (S.s === 'count') {
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText(Math.ceil(S.t), W / 2, 100);
  } else if (S.s === 'play') {
    // 【追加要素2】開始5秒間のアクションロックアナウンス
    if (S.el < 5.0) {
      const rem = (5.0 - S.el).toFixed(1);
      ctx.fillStyle = '#ff9800';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(`🔒 アクション解除まで: ${rem}秒`, W / 2, 40);
    }
  } else if (S.s === 'result') {
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(S.msg, W / 2, 100);
    ctx.font = '16px sans-serif';
    ctx.fillText(S.sub, W / 2, 130);
  }
}

(function loop() {
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
