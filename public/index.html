<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
html,body{margin:0;background:#10131a;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
#wrap{position:relative;width:720px;max-width:100%;}
canvas{display:block;width:100%;height:auto;background:#000;border:2px solid #333;border-radius:4px;}

/* ---- ロビー画面 ---- */
#lobby-overlay{position:absolute;inset:0;background:rgba(10,12,20,.96);display:flex;flex-direction:column;}
.lobby-title{font-size:36px;font-weight:900;margin-bottom:20px;color:#ffd54f;text-shadow:0 0 12px rgba(255,213,79,.3);text-align:center;padding-top:40px;}

.menu-grid{display:flex;flex-direction:column;gap:12px;width:280px;margin:0 auto 15px;}
.menu-btn{font-size:16px;font-weight:bold;padding:12px;border-radius:8px;border:0;background:#ffd54f;color:#000;cursor:pointer;transition:transform 0.1s;}
.menu-btn:hover{background:#ffe082;transform:translateY(-1px);}
.menu-btn-sub{background:#37474f;color:#fff;}
.menu-btn-sub:hover{background:#455a64;}

#room-panel{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:10px;}
.input-row{display:flex;gap:8px;}
input[type="text"]{background:#111;border:1px solid #444;color:#fff;font-size:16px;padding:8px;width:120px;text-align:center;border-radius:4px;}
#st{color:#4fc3f7;font-size:14px;margin-top:8px;}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="720" height="540"></canvas>
  
  <div id="lobby-overlay">
    <div class="lobby-title">なにが目的なん？ ONLINE</div>
    
    <div class="menu-grid" id="main-menu">
      <button class="menu-btn" id="btn-solo">VS NPC (ソロ)</button>
      <button class="menu-btn menu-btn-sub" onclick="showRoomPanel()">フレンドと対戦</button>
    </div>

    <div id="room-panel">
      <button class="menu-btn" style="width:200px;" id="create">部屋を作成</button>
      <div class="input-row">
        <input type="text" id="code" maxlength="6" placeholder="部屋コード">
        <button class="menu-btn menu-btn-sub" style="padding:8px 16px;" id="join">参加</button>
      </div>
      <button class="menu-btn menu-btn-sub" style="font-size:12px;padding:4px 8px;margin-top:10px;" onclick="showMainMenu()">戻る</button>
      <div id="st"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 720, H = 540;
const $ = id => document.getElementById(id);

let slot = 0, S = null, inGame = false;
let last = { l: 0, r: 0 };

function showRoomPanel() { $('main-menu').style.display = 'none'; $('room-panel').style.display = 'flex'; $('st').textContent = ''; }
function showMainMenu() { $('main-menu').style.display = 'flex'; $('room-panel').style.display = 'none'; $('st').textContent = ''; }

$('btn-solo').onclick = () => {
  socket.emit('joinBot', res => { if (res && !res.ok) alert(res.err); });
};

$('create').onclick = () => {
  socket.emit('create', res => { if (res && res.code) $('st').textContent = 'コード: ' + res.code + ' (対戦相手待ち)'; });
};

$('join').onclick = () => {
  const codeVal = $('code').value.trim();
  if (!codeVal) return;
  socket.emit('join', codeVal, res => { if (res && !res.ok) $('st').textContent = res.err; });
};

socket.on('start', d => {
  slot = d.slot;
  inGame = true;
  $('lobby-overlay').style.display = 'none';
});

socket.on('left', () => {
  if (inGame) {
    alert('相手が退出しました');
    inGame = false;
    $('lobby-overlay').style.display = 'flex';
    showMainMenu();
  }
});

socket.on('st', s => { S = s; });

const keys = {};
function sendInp() {
  const l = +!!(keys.KeyA || keys.ArrowLeft);
  const r = +!!(keys.KeyD || keys.ArrowRight);
  if (l !== last.l || r !== last.r) {
    last = { l, r };
    socket.emit('inp', { l, r });
  }
}

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) socket.emit('act');
  }
  keys[e.code] = true;
  sendInp();
});

addEventListener('keyup', e => {
  keys[e.code] = false;
  sendInp();
});

function draw() {
  ctx.fillStyle = '#10131a';
  ctx.fillRect(0, 0, W, H);

  if (!inGame || !S || !S.P) return;

  const me = S.P[slot];
  if (!me) return;

  // 道路の横幅を半分（520px -> 260px）に変更
  const roadWidth = 260;
  const roadLeft = (W - roadWidth) / 2;
  ctx.fillStyle = '#222';
  ctx.fillRect(roadLeft, 0, roadWidth, H);

  // 白線（白のサイドライン）
  ctx.fillStyle = '#fff';
  ctx.fillRect(roadLeft - 4, 0, 4, H);
  ctx.fillRect(roadLeft + roadWidth, 0, 4, H);

  // プレイヤー描画
  S.P.forEach((p, idx) => {
    if (!p) return;
    const px = W / 2 + p.x;
    const py = H / 2 - (p.z - me.z) * 0.5;

    // ブースト演出（視認化）：オーラと拡大エフェクト
    if (p.boost) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 235, 59, 0.4)';
      ctx.beginPath();
      ctx.arc(px, py, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = idx === 0 ? '#4fc3f7' : '#ff4655';
    ctx.beginPath();
    ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fill();

    // ブースト中テキストインジケーター
    if (p.boost) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BOOST!', px, py - 20);
    }
  });

  // UI・カウント表示
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  if (S.s === 'count') {
    ctx.fillText('カウントダウン: ' + Math.ceil(S.t), W / 2, 80);
  } else if (S.s === 'play') {
    // 5秒経過前はロックアナウンスを表示
    if (S.el < 5.0) {
      const remaining = (5.0 - S.el).toFixed(1);
      ctx.fillStyle = '#ff9800';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('スキルロック解除まで: ' + remaining + '秒', W / 2, 50);
    }
  } else if (S.s === 'result') {
    ctx.fillText(S.msg, W / 2, 80);
  }
}

(function loop() {
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
