<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2人対戦自転車追走アクション</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #222; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { position: relative; width: 800px; height: 600px; background: #333; border: 4px solid #fff; border-radius: 8px; overflow: hidden; }
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 10; }
    .hidden { display: none !important; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; color: #ffcc00; }
    .btn-group { margin: 20px 0; }
    button { padding: 10px 20px; font-size: 1.1rem; font-weight: bold; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #ffe680; }
    input { padding: 10px; font-size: 1.1rem; text-align: center; border-radius: 5px; border: none; width: 140px; text-transform: uppercase; }
    #hud { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 5; font-weight: bold; }
  </style>
</head>
<body>

<div id="app">
  <!-- タイトル・ロビー画面 -->
  <div id="lobby-screen" class="screen">
    <h1>自転車追走アクション</h1>
    <p>後ろが見えなくても「音の波形」で相手の位置を察知せよ！</p>
    
    <div class="btn-group">
      <button onclick="createRoom()">部屋を作成する</button>
    </div>
    
    <div style="display: flex; gap: 10px;">
      <input type="text" id="roomCodeInput" placeholder="6桁コード" maxlength="6">
      <button onclick="joinRoom()">部屋に入る</button>
    </div>

    <div id="statusText" style="margin-top:20px; color:#ff3366;"></div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="roleText">Role: -</div>
    <div id="roomDisp">Room: -</div>
  </div>

  <!-- ゲーム画面 -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const lobbyScreen = document.getElementById('lobby-screen');
  const hud = document.getElementById('hud');
  const statusText = document.getElementById('statusText');
  const roleText = document.getElementById('roleText');
  const roomDisp = document.getElementById('roomDisp');

  let myPlayerNumber = 0;
  let roomCode = '';
  let inGame = false;

  let player = { x: 100, y: 300, vx: 0, vy: 0, speed: 5, radius: 18, color: '#00ccff' };
  let opponent = { x: 700, y: 300, radius: 18, color: '#ff3366' };
  
  let soundWaves = [];
  const keys = {};

  window.addEventListener('keydown', (e) => keys[e.key] = true);
  window.addEventListener('keyup', (e) => keys[e.key] = false);

  function createRoom() {
    socket.emit('createRoom');
    statusText.innerText = '部屋を作成しています...';
  }

  function joinRoom() {
    const code = document.getElementById('roomCodeInput').value;
    if (code) {
      socket.emit('joinRoom', code);
      statusText.innerText = '参加中...';
    }
  }

  socket.on('roomCreated', (data) => {
    roomCode = data.roomCode;
    myPlayerNumber = data.playerNumber;
    statusText.innerText = `部屋コード: ${roomCode} （相手の参加を待っています）`;
  });

  socket.on('roomJoined', (data) => {
    roomCode = data.roomCode;
    myPlayerNumber = data.playerNumber;
  });

  socket.on('errorMsg', (msg) => statusText.innerText = msg);

  socket.on('gameStart', () => {
    inGame = true;
    lobbyScreen.classList.add('hidden');
    hud.classList.remove('hidden');

    roomDisp.innerText = `ROOM: ${roomCode}`;
    if (myPlayerNumber === 1) {
      player.color = '#00ccff'; player.x = 100;
      opponent.color = '#ff3366'; opponent.x = 700;
      roleText.innerText = 'あなた: 逃走者 (青)';
    } else {
      player.color = '#ff3366'; player.x = 700;
      opponent.color = '#00ccff'; opponent.x = 100;
      roleText.innerText = 'あなた: 追跡者 (赤)';
    }

    // 移動時に音の波形（音波）を送信
    setInterval(() => {
      if (inGame && (Math.abs(player.vx) > 0 || Math.abs(player.vy) > 0)) {
        socket.emit('soundPulse', { x: player.x, y: player.y });
      }
    }, 300);

    requestAnimationFrame(gameLoop);
  });

  socket.on('opponentMove', (data) => {
    opponent.x = data.x;
    opponent.y = data.y;
  });

  socket.on('opponentSound', (data) => {
    soundWaves.push({ x: data.x, y: data.y, radius: 5, alpha: 1.0 });
  });

  socket.on('playerLeft', () => {
    alert('対戦相手が退出しました');
    location.reload();
  });

  function update() {
    if (!inGame) return;

    player.vx = 0; player.vy = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.vy = -player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.vy = player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.vx = -player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.vx = player.speed;

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + player.vx));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + player.vy));

    socket.emit('playerMove', { x: player.x, y: player.y });

    // 音波アニメーション
    for (let i = soundWaves.length - 1; i >= 0; i--) {
      let w = soundWaves[i];
      w.radius += 3;
      w.alpha -= 0.03;
      if (w.alpha <= 0) soundWaves.splice(i, 1);
    }
  }

  function drawBike(x, y, color, isSelf) {
    ctx.save();
    // 自転車（車輪＋ボディ）
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - 8, y, 6, 0, Math.PI * 2); // 後輪
    ctx.arc(x + 8, y, 6, 0, Math.PI * 2); // 前輪
    ctx.fill();

    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x - 8, y);
    ctx.lineTo(x + 8, y);
    ctx.stroke();

    if (isSelf) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, y - 12, 4, 0, Math.PI * 2); // プレイヤー表示
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSoundWaves() {
    soundWaves.forEach(w => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 204, 0, ${w.alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();

      // イコライザー波形風の演出
      const numBars = 6;
      for (let i = 0; i < numBars; i++) {
        let angle = (i / numBars) * Math.PI * 2;
        let bx = w.x + Math.cos(angle) * w.radius;
        let by = w.y + Math.sin(angle) * w.radius;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(angle) * 8, by + Math.sin(angle) * 8);
        ctx.strokeStyle = `rgba(255, 255, 255, ${w.alpha})`;
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 道路背景
    ctx.fillStyle = '#444';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 音の波形表示
    drawSoundWaves();

    // プレイヤー描画
    drawBike(player.x, player.y, player.color, true);
    drawBike(opponent.x, opponent.y, opponent.color, false);
  }

  function gameLoop() {
    if (!inGame) return;
    update();
    render();
    requestAnimationFrame(gameLoop);
  }
</script>
</body>
</html>
