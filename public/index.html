<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
html,body{margin:0;padding:0;background:#0f1115;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;height:100vh;}
#wrap{position:relative;width:720px;height:540px;max-width:100%;background:#000;border:2px solid #222;box-shadow:0 0 40px rgba(0,0,0,0.8);}
canvas{display:block;width:100%;height:100%;}

/* UI Overlay */
#lobby-overlay{position:absolute;inset:0;background:radial-gradient(circle at center, #1a1e29 0%, #0b0d12 100%);display:flex;flex-direction:column;z-index:10;}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;border-bottom:1px solid rgba(255,255,255,0.05);}
.logo{font-family:'Teko',sans-serif;font-size:32px;font-weight:700;color:#ff4655;letter-spacing:2px;line-height:1;}

.main-content{flex:1;display:flex;flex-direction:column;position:relative;padding:40px;}
.bg-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Teko',sans-serif;font-size:100px;font-weight:700;color:rgba(255,255,255,0.03);white-space:nowrap;pointer-events:none;}

.menu-area{position:absolute;bottom:40px;right:40px;display:flex;flex-direction:column;align-items:flex-end;gap:15px;}
.btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;font-weight:bold;padding:12px 24px;cursor:pointer;transition:0.2s;}
.btn:hover{background:rgba(255,255,255,0.2);}
.btn-play{background:#ff4655;border:none;color:#fff;font-size:22px;font-weight:900;padding:14px 36px;clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);}
.btn-play:hover{background:#ff5e6b;}

#room-panel{display:none;flex-direction:column;align-items:flex-end;gap:10px;background:rgba(0,0,0,0.6);padding:20px;border-left:4px solid #ff4655;}
.input-row{display:flex;gap:8px;}
input[type="text"]{background:#111;border:1px solid #444;color:#fff;font-size:16px;padding:8px;width:120px;text-align:center;}
#st{color:#4fc3f7;font-size:14px;margin-top:6px;}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="720" height="540"></canvas>
  
  <div id="lobby-overlay">
    <div class="header">
      <div class="logo">NANIGA MOKUTEKINAN?</div>
      <div style="font-size:13px;color:#8b97a3">🚴 ONLINE CHASE</div>
    </div>
    
    <div class="main-content">
      <div class="bg-title">CHASE OR BE CHASED</div>
      
      <div class="menu-area">
        <div id="main-menu" style="display:flex;flex-direction:column;gap:12px;align-items:flex-end;">
          <button class="btn btn-play" id="btn-solo">▶ VS NPC (ソロ)</button>
          <button class="btn" onclick="showRoomPanel()">🌐 フレンドと対戦</button>
        </div>

        <div id="room-panel">
          <button class="btn" style="width:100%;" id="create">新規ルーム作成</button>
          <div class="input-row">
            <input type="text" id="code" maxlength="6" placeholder="6桁コード">
            <button class="btn" style="background:#4fc3f7;color:#000;border:none;" id="join">参加</button>
          </div>
          <button class="btn" style="font-size:12px;padding:4px 8px;background:transparent;border:none;color:#888;" onclick="showMainMenu()">戻る</button>
          <div id="st"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

function showMainMenu() { $('main-menu').style.display = 'flex'; $('room-panel').style.display = 'none';$('st').textContent = ''; }

  const codeVal = $('code').value.trim();

};
