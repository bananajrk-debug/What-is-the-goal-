<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なにが目的なん？ ONLINE</title>
<style>
html,body{margin:0;background:#10131a;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#wrap{position:relative;max-width:100%}
canvas{display:block;max-width:100%;height:auto;background:#000;border:2px solid #333}
#lobby{position:absolute;inset:0;background:rgba(10,12,20,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10}
h1{margin:0 0 2px;font-size:34px}
button,input{font-size:16px;padding:8px 14px;border-radius:8px;border:0}
button{background:#ffd54f;font-weight:bold;cursor:pointer}
button.solo{background:#81c784}
button.shop-btn{background:#ba68c8;color:#fff}
input{width:180px;text-align:center}
#pname{width:180px;font-weight:bold}
#code{width:130px;letter-spacing:3px}
#st{min-height:20px;color:#9fd;font-size:14px}
#profile-box{font-size:13px;color:#bbb;background:rgba(255,255,255,0.07);padding:6px 12px;border-radius:6px;display:flex;gap:12px;align-items:center}
#shop-modal{position:absolute;inset:0;background:rgba(15,18,28,0.98);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
.skin-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.skin-card{background:#222738;padding:10px 16px;border-radius:8px;border:2px solid #444;cursor:pointer;text-align:center;width:110px}
.skin-card.selected{border-color:#ffd54f}
p{font-size:13px;color:#aab;margin:6px 12px;text-align:center}
</style></head><body>
<div id="wrap"><canvas id="c" width="720" height="540"></canvas>
<div id="lobby">
  <h1>なにが目的なん？</h1>
  <div id="profile-box">
    <span id="disp-id">ID: ---</span>
    <span>NMcoin: <b id="disp-coin" style="color:#ffd54f">0</b> NC</span>
  </div>
  <div><input id="pname" maxlength="10" placeholder="プレイヤー名" value="プレイヤー"></div>
  <button id="solo" class="solo">ソロ（CPU対戦）</button>
  <button id="create">ルーム作成</button>
  <div><input id="code" maxlength="6" placeholder="6桁コード" inputmode="numeric"> <button id="join">参加</button></div>
  <button id="open-shop" class="shop-btn">スキンショップ / 着替え</button>
  <div id="st"></div>
</div>

<div id="shop-modal">
  <h2>🚲 スキンショップ</h2>
  <p>NMcoinを使って見た目を変更しよう（※ゲーム性能は変わりません）</p>
  <div class="skin-grid" id="skin-list"></div>
  <p id="shop-st" style="color:#ffb74d"></p>
  <button id="close-shop">ロビーへ戻る</button>
</div>
</div>
<p>左右：A / D または ← / →  アクション(急ブレーキ・ブースト)：W / ↑ / Space  再戦：Enter  ロビーへ戻る：Esc</p>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(),cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=720,H=540;
const $=id=>document.getElementById(id),COL=['#4fc3f7','#ffb74d'],CAR=['#c33','#3a6','#58c','#c9a','#999'];
const HY=170,GY=540,K=1.9,ROAD_W=112.5;
let slot=0,S=null,D=null,inGame=false,last={l:0,r:0};
let hitEffects = [];

// --- Web Audio API (BGM & SE) ---
let audioCtx = null;
let bgmInterval = null;

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

// ポップBGM（長めループ）
function startBGM(){
  initAudio();
  if(bgmInterval) return;
  const melody = [
    261.63, 329.63, 392.00, 523.25, 349.23, 440.00, 523.25, 659.25,
    293.66, 369.99, 440.00, 587.33, 392.00, 493.88, 587.33, 783.99,
    523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63,
    220.00, 261.63, 329.63, 392.00, 440.00, 523.25, 659.25, 783.99
  ];
  let stepIdx = 0;
  bgmInterval = setInterval(() => {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(melody[stepIdx], audioCtx.currentTime);
    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.32);
    stepIdx = (stepIdx + 1) % melody.length;
  }, 200);
}

function stopBGM(){
  if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
}

// A（攻撃側）のブレーキ音：「キュッ！」
function playBrakeSound(){
  initAudio();
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

// B（追越側）のブースト音：「ギュイーン！」
function playBoostSound(){
  initAudio();
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(250, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.35);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.42);
}

// 衝突・ひかれたときの音：「ガシャン！」
function playCrashSound(){
  initAudio();
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++){ data[i] = Math.random() * 2 - 1; }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.35);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.38);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

const myArtImg = new Image();
myArtImg.src = 'my_art.png';

let nmId = localStorage.getItem('nm_id');
if(!nmId){
  nmId = 'NM-' + Math.floor(100000 + Math.random() * 900000);
  localStorage.setItem('nm_id', nmId);
}
let myCoins = parseInt(localStorage.getItem('nm_coins') || '0', 10);
let ownedSkins = JSON.parse(localStorage.getItem('nm_owned_skins') || '["default"]');
let currentSkin = localStorage.getItem('nm_current_skin') || 'default';

$('disp-id').textContent = 'ID: ' + nmId;
$('disp-coin').textContent = myCoins;

const SKINS = {
  'default': { name: 'スタンダード', color: '#c33', price: 0 },
  'gold':    { name: 'ゴールド', color: '#ffd700', price: 50 },
  'cyber':   { name: 'サイバー', color: '#00ffcc', price: 100 },
  'dark':    { name: 'ダーク', color: '#333333', price: 80 },
  'myart':   { name: '自作イラスト', color: '#ff69b4', price: 150 }
};

function updateShopUI(){
  $('disp-coin').textContent = myCoins;
  const list = $('skin-list');
  list.innerHTML = '';
  for(const [key, skin] of Object.entries(SKINS)){
    const owned = ownedSkins.includes(key);
    const selected = currentSkin === key;
    const div = document.createElement('div');
    div.className = 'skin-card' + (selected ? ' selected' : '');
    div.innerHTML = `<div style="width:30px;height:15px;background:${skin.color};margin:0 auto 6px;border-radius:3px"></div>` +
                    `<b>${skin.name}</b><br>` +
                    `<small>${owned ? (selected ? '装着中' : '所持') : skin.price + ' NC'}</small>`;
    div.onclick = () => {
      if(owned){
        currentSkin = key;
        localStorage.setItem('nm_current_skin', currentSkin);
        updateShopUI();
        $('shop-st').textContent = skin.name + 'を装着しました！';
      } else {
        if(myCoins >= skin.price){
          myCoins -= skin.price;
          localStorage.setItem('nm_coins', myCoins);
          ownedSkins.push(key);
          localStorage.setItem('nm_owned_skins', JSON.stringify(ownedSkins));
          currentSkin = key;
          localStorage.setItem('nm_current_skin', currentSkin);
          updateShopUI();
          $('shop-st').textContent = skin.name + 'を購入しました！';
        } else {
          $('shop-st').textContent = 'コインが足りません！';
        }
      }
    };
    list.appendChild(div);
  }
}

$('open-shop').onclick = () => { updateShopUI();$('shop-modal').style.display = 'flex'; };
$('close-shop').onclick = () => {$('shop-modal').style.display = 'none'; };

function getName(){ const val=$('pname').value.trim(); return val||'プレイヤー'; }
function getPayload(){ return { name: getName(), id: nmId, skin: currentSkin }; }

function returnLobby(){
  socket.emit('leave');
  inGame=false;S=D=null;
  stopBGM();
  $('lobby').style.display='flex';$('st').textContent='';
}

$('solo').onclick=()=> { initAudio(); startBGM(); socket.emit('solo', getPayload()); };
$('create').onclick=()=> { initAudio(); startBGM(); socket.emit('create', getPayload(), r=>{$('st').textContent='ルームコード: '+r.code+'  （相手の参加を待っています…）';}); };
$('join').onclick=()=> { initAudio(); startBGM(); socket.emit('join', { code: $('code').value.trim(), ...getPayload() }, r=>{if(!r.ok)$('st').textContent=r.err;}); };

socket.on('start',d=>{
  slot=d.slot;inGame=true;S=D=null;
  startBGM();
  $('lobby').style.display='none';$('shop-modal').style.display='none';
});

socket.on('left',()=>{returnLobby();$('st').textContent='相手が退出しました';});

socket.on('reward', data => {
  if(data.gain){
    myCoins += data.gain;
    localStorage.setItem('nm_coins', myCoins);
    $('disp-coin').textContent = myCoins;
  }
});

let lastState = '';
socket.on('st',s=>{
  if(D && s.s === 'result' && lastState !== 'result'){
    playCrashSound();
  }
  lastState = s.s;
  S=s;
});

const keys={};
function sendInp(){
  if(!inGame) return;
  const l=+!!(keys.KeyA||keys.ArrowLeft),r=+!!(keys.KeyD||keys.ArrowRight);
  if(l!==last.l||r!==last.r){last={l,r};socket.emit('inp',{l,r});}
}

addEventListener('keydown',e=>{
  initAudio();
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code]){
    if(['KeyW','ArrowUp','Space'].includes(e.code)&&inGame){
      socket.emit('act');
      // 役職（攻撃側Aか、追越側Bか）に応じて専用SEを鳴らす
      if(D && D.att === slot){
        playBrakeSound(); // A: ブレーキ音
      } else {
        playBoostSound(); // B: ギュイーン音
      }
    }
    if(e.code==='Enter'&&inGame)socket.emit('again');
    if(e.code==='Escape'&&inGame)returnLobby();
  }
  keys[e.code]=true;sendInp();
});
addEventListener('keyup',e=>{keys[e.code]=false;sendInp();});

cv.addEventListener('click',e=>{
  if(!inGame||!D||D.s!=='match')return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const y=(e.clientY-rect.top)*(H/rect.height);
  if(y>=310&&y<=345){
    if(x>=W/2-180&&x<=W/2-20)socket.emit('again');
    if(x>=W/2+20&&x<=W/2+180)returnLobby();
  }
});

function sync(dt){
  if(!S)return;
  if(!D||S.s==='count'||S.rd!==D.rd){D=JSON.parse(JSON.stringify(S));return;}
  const k=Math.min(1,dt*18),old={};
  if(D.obs) D.obs.forEach(o=>old[o.id]=o);
  
  const P=(S.P||[]).map((t,i)=>{
    const c=D.P?D.P[i]:null;
    if(!t)return null;if(!c)return t;
    c.x+=(t.x-c.x)*k;c.z+=(t.z-c.z)*k;c.v=t.v;c.brk=t.brk;c.brakes=t.brakes;c.boost=t.boost;c.cd=t.cd;c.skin=t.skin;return c;
  });
  const obs=(S.obs||[]).map(o=>{const c=old[o.id];if(!c)return{...o};c.x+=(o.x-c.x)*k;c.z+=(o.z-c.z)*k;return c;});
  Object.assign(D,{s:S.s,t:S.t,rd:S.rd,att:S.att,sc:S.sc,hist:S.hist,msg:S.msg,sub:S.sub,el:S.el,P,obs,bgGap:S.bgGap,bgBx:S.bgBx,bgBoost:S.bgBoost,names:S.names});
}

function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}

function tree(X,Y,s){
  const k=s*K*28;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(X,Y,k*.8,k*.25,0,0,7);ctx.fill();
  ctx.fillStyle='#5c3a21';ctx.fillRect(X-k*.15,Y-k*2.5,k*.3,k*2.5);
  ctx.fillStyle='#1e5e22';ctx.beginPath();ctx.arc(X,Y-k*3.2,k*1.2,0,7);ctx.fill();
  ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(X-k*.2,Y-k*3.4,k*.9,0,7);ctx.fill();
  ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(X-k*.3,Y-k*3.7,k*.5,0,7);ctx.fill();
}

// トゲトゲ爆発エフェクト（円形なし、トゲのみ）
function drawSpikyExplosion(X, Y, progress){
  ctx.save();
  ctx.translate(X, Y);
  ctx.scale(progress, progress);
  
  ctx.fillStyle = '#ff3d00';
  ctx.strokeStyle = '#ffeb3b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  const spikes = 10;
  const outerRadius = 50;
  const innerRadius = 24;
  for (let i = 0; i < spikes * 2; i++) {
    const r = (i % 2 === 0) ? outerRadius : innerRadius;
    const angle = (i * Math.PI) / spikes;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function bike(X,Y,s,col,p){
  const k=s*K*22;
  let bikeColor = col;
  if(p.skin === 'gold') bikeColor = '#ffd700';
  else if(p.skin === 'cyber') bikeColor = '#00ffcc';
  else if(p.skin === 'dark') bikeColor = '#333333';

  if(p.boost){ctx.fillStyle='rgba(255,230,80,.45)';ctx.beginPath();ctx.arc(X,Y-k*2.5,k*2.5,0,7);ctx.fill();}
  
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(X,Y,k*1.2,k*0.4,0,0,7);ctx.fill();
  
  // タイヤ
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(X - k * 0.45, Y - k * 1.8, k * 0.9, k * 1.8);
  ctx.fillStyle='#333';
  ctx.fillRect(X - k * 0.3, Y - k * 1.7, k * 0.6, k * 1.6);
  ctx.fillStyle='#555';
  ctx.fillRect(X - k * 0.1, Y - k * 1.6, k * 0.2, k * 1.4);

  // ハンドル（奥側）
  ctx.fillStyle='#222';
  ctx.fillRect(X - k * 1.15, Y - k * 3.1, k * 2.3, k * 0.3);
  ctx.fillStyle='#555';
  ctx.fillRect(X - k * 0.12, Y - k * 3.1, k * 0.24, k * 0.9);

  // フレーム
  ctx.fillStyle='#111';
  ctx.fillRect(X-k*.2,Y-k*2.4,k*.4,k*2.4);

  // 足
  ctx.fillStyle='#222';
  ctx.fillRect(X - k * 0.7, Y - k * 1.8, k * 0.4, k * 1.1);
  ctx.fillRect(X + k * 0.3, Y - k * 1.8, k * 0.4, k * 1.1);
  ctx.fillStyle='#111';
  ctx.fillRect(X - k * 0.85, Y - k * 0.9, k * 0.5, k * 0.35);
  ctx.fillRect(X + k * 0.35, Y - k * 0.9, k * 0.5, k * 0.35);

  // キャラクター
  if(p.skin === 'myart' && myArtImg.complete && myArtImg.naturalWidth !== 0){
    const imgRatio = myArtImg.naturalWidth / myArtImg.naturalHeight;
    const baseH = k * 1.9;
    const baseW = baseH * imgRatio;
    ctx.drawImage(myArtImg, X - baseW / 2, Y - k * 4.0, baseW, baseH);
  } else {
    ctx.fillStyle = bikeColor;
    ctx.fillRect(X - k * 0.65, Y - k * 3.8, k * 1.3, k * 1.9);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(X - k * 0.55, Y - k * 3.7, k * 0.3, k * 1.7);
  }

  ctx.fillStyle='#ffd7b0';ctx.beginPath();ctx.arc(X,Y-k*4.3,k*.55,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(X-k*0.15,Y-k*4.5,k*.2,0,7);ctx.fill();

  if(p.brk){ctx.fillStyle='#f22';ctx.fillRect(X-k*.5,Y-k*1.6,k*1.0,k*.4);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(X-k*.4,Y-k*1.5,k*.8,k*.15);}
}

function car(X,Y,s,o){
  const k=s*K*22,cop=o.k==='cop',f=Math.floor(Date.now()/150)%2;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(X-k*1.5,Y-k*.2,k*3,k*.4);
  ctx.fillStyle=cop?'#f4f4f4':CAR[o.c%5];ctx.fillRect(X-k*1.5,Y-k*2.2,k*3,k*2);
  ctx.fillStyle='#223';ctx.fillRect(X-k*1.1,Y-k*3.2,k*2.2,k*1.1);
  if(cop){ctx.fillStyle='#111';ctx.fillRect(X-k*1.5,Y-k*1.3,k*3,k*.4);
    ctx.fillStyle=f?'#f22':'#25f';ctx.fillRect(X-k*.9,Y-k*3.5,k*.9,k*.3);
    ctx.fillStyle=f?'#25f':'#f22';ctx.fillRect(X,Y-k*3.5,k*.9,k*.3);
    ctx.fillStyle='#f33';ctx.fillRect(X-k*1.4,Y-k*1.9,k*.5,k*.3);ctx.fillRect(X+k*.9,Y-k*1.9,k*.5,k*.3);}
  else{ctx.fillStyle='#ff8';ctx.fillRect(X-k*1.3,Y-k*1.1,k*.6,k*.4);ctx.fillRect(X+k*.7,Y-k*1.1,k*.6,k*.4);}
}

function drawTriangleMarker(me, gap, bx, isBoost) {
  if (gap === undefined || gap === null || gap > 260 || !me) return;

  const prox = Math.max(0, 1 - gap / 250);
  const camx = me.x * 0.6;
  const sBottom = 1;
  
  const roadLeftX = W/2 + (-ROAD_W - camx) * sBottom * K;
  const roadRightX = W/2 + (ROAD_W - camx) * sBottom * K;

  const normX = (bx + ROAD_W) / (ROAD_W * 2);
  const targetX = Math.max(roadLeftX + 15, Math.min(roadRightX - 15, roadLeftX + normX * (roadRightX - roadLeftX)));
  
  const size = 12 + prox * 20; 
  const baseY = H - 38;

  const barLeft = Math.max(0, roadLeftX);
  const barRight = Math.min(W, roadRightX);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(barLeft, H - 45, barRight - barLeft, 45);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(barLeft, H - 45);
  ctx.lineTo(barRight, H - 45);
  ctx.stroke();

  ctx.fillStyle = isBoost ? '#ffeb3b' : '#ffffff';
  ctx.beginPath();
  ctx.moveTo(targetX - size, baseY);
  ctx.lineTo(targetX + size, baseY);
  ctx.lineTo(targetX, baseY + size * 1.2);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function view(){
  if(!D||!D.P||!D.P[slot]) return;
  const me=D.P[slot],isA=D.att===slot,camz=me.z-45,camx=me.x*.6;
  
  const g=ctx.createLinearGradient(0,0,0,HY);g.addColorStop(0,'#2b5c8f');g.addColorStop(1,'#87ceeb');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HY);
  const gGrass=ctx.createLinearGradient(0,HY,0,H);gGrass.addColorStop(0,'#2d6a2e');gGrass.addColorStop(1,'#1b431c');
  ctx.fillStyle=gGrass;ctx.fillRect(0,HY,W,H-HY);

  const S_=z=>140/(140+z-camz),Y=s=>HY+(GY-HY)*s,X=(x,s)=>W/2+(x-camx)*s*K;
  const q=(x1,x2,z1,z2,c)=>{const a=S_(z1),b=S_(z2);poly([[X(x1,a),Y(a)],[X(x2,a),Y(a)],[X(x2,b),Y(b)],[X(x1,b),Y(b)]],c);};
  
  q(-ROAD_W,ROAD_W,camz+1,camz+2500,'#4a4d52');
  for(let z=Math.floor(camz/40)*40;z<camz+1000;z+=40){
    if(z+40<camz+1)continue;const zz=Math.max(z,camz+1),c=((z/40)&1)?'#d32f2f':'#ffffff';
    q(-ROAD_W-12,-ROAD_W,zz,z+40,c);q(ROAD_W,ROAD_W+12,zz,z+40,c);q(-2,2,zz,z+20,'#fbc02d');}
  
  const items=[];

  for(let z=Math.floor(camz/80)*80;z<camz+1000;z+=80){
    if(z<camz+5)continue;
    items.push({z, f:()=>tree(X(-ROAD_W-40, S_(z)), Y(S_(z)), S_(z))});
    items.push({z, f:()=>tree(X(ROAD_W+40, S_(z)), Y(S_(z)), S_(z))});
  }

  if(D.obs) D.obs.forEach(o=>items.push({z:o.z,f:()=>car(X(o.x,S_(o.z)),Y(S_(o.z)),S_(o.z),o)}));
  
  if(D.P) D.P.forEach((p,i)=>{
    if(p) {
      if(isA && i !== slot && !p.boost) return;
      items.push({z:p.z,f:()=>bike(X(p.x,S_(p.z)),Y(S_(p.z)),S_(p.z),COL[i],p)});
    }
  });
  items.filter(i=>i.z-camz>1).sort((a,b)=>b.z-a.z).forEach(i=>i.f());

  // ラウンド結果になったとき（車にひかれた、またはプレイヤー同士が衝突したとき）にトゲトゲエフェクトを追加
  if(D.s === 'result' && D.msg && (D.msg.includes('衝突') || D.msg.includes('逮捕') || D.msg.includes('激突') || D.sub.includes('車') || D.sub.includes('攻撃側') || D.sub.includes('パトカー'))){
    if(hitEffects.length === 0){
      hitEffects.push({ x: W/2, y: H/2 + 20, life: 1.0 });
    }
  }

  hitEffects.forEach((fx) => {
    drawSpikyExplosion(fx.x, fx.y, fx.life);
    fx.life -= 0.05;
  });
  hitEffects = hitEffects.filter(fx => fx.life > 0);

  if(isA) {
    drawTriangleMarker(me, D.bgGap, D.bgBx, D.bgBoost);
  }

  const cop=D.obs?D.obs.find(o=>o.k==='cop'&&o.z<camz+1&&camz-o.z<400):null;
  if(cop&&D.s==='play'){const f=Math.floor(Date.now()/150)%2;
    ctx.strokeStyle=f?'rgba(255,40,40,.8)':'rgba(40,80,255,.8)';ctx.lineWidth=14;ctx.strokeRect(7,67,W-14,H-74);
    ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText('🚨 パトカー接近！('+(cop.x<me.x?'左':'右')+'寄り) 進路を空けろ',W/2,125);}

  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,66,W,28);
  ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillText(isA?'攻撃(A)：下の▼マーカーでBの位置を察知しろ！急ブレーキで潰せ':'追越(B)：立ち漕ぎでAを抜け！',10,85);
  
  const actReady = D.el >= 3;
  if(!actReady){
    const rem = Math.max(0, 3 - D.el).toFixed(1);
    ctx.fillStyle='#ffab40';ctx.font='bold 13px sans-serif';ctx.textAlign='right';
    ctx.fillText('アクション解禁まで '+rem+'秒',W-10,85);
  }else{
    if(isA){for(let n=0;n<3;n++){ctx.fillStyle=n<me.brakes?'#f44':'#444';ctx.beginPath();ctx.arc(W-20-n*26,80,9,0,7);ctx.fill();}
      ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText('急ブレーキ',W-90,85);}
    else{ctx.fillStyle='#333';ctx.fillRect(W-150,73,140,14);ctx.fillStyle=me.cd<=0?'#7f7':'#fc4';
      ctx.fillRect(W-150,73,140*(me.cd<=0?1:1-me.cd/3.5),14);ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText('立ち漕ぎブースト',W-156,85);}
  }
}

function topbar(){
  if(!D) return;
  ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,W,62);
  const o=1-slot;
  const names = D.names || ['プレイヤー1', 'プレイヤー2'];
  [[slot,20,'left',names[slot]||'あなた'],[o,W-20,'right',names[o]||'相手']].forEach(([i,x,al,lb])=>{
    ctx.textAlign=al;ctx.fillStyle=COL[i];ctx.font='bold 18px sans-serif';ctx.fillText(lb+'  '+(D.sc?D.sc[i]:0),x,24);
    ctx.fillStyle='#ccc';ctx.font='12px sans-serif';ctx.fillText(D.att===i?'攻撃 (A)':'追越 (B)',x,42);
    for(let n=0;n<4;n++){ctx.fillStyle=n<(D.sc?D.sc[i]:0)?COL[i]:'#333';ctx.beginPath();ctx.arc(al==='left'?x+110+n*18:x-110-n*18,18,6,0,7);ctx.fill();}});
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';
  ctx.fillText(D.rd>=6?'SUDDEN DEATH':'ROUND '+(D.rd+1)+(D.rd<3?' (前半)':' (後半)'),W/2,20);
  const hist = D.hist || [];
  const n=Math.max(6,hist.length);
  for(let k=0;k<n;k++){const x=W/2-(n-1)*9+k*18,h=hist[k];ctx.strokeStyle='#888';
    ctx.fillStyle=k<hist.length?(h<0?'#777':COL[h]):'#0b0e14';ctx.beginPath();ctx.arc(x,42,6,0,7);ctx.fill();ctx.stroke();}
}

function overlay(t,s,c){
  const isMatchEnd = D && D.s === 'match';
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,190,W,isMatchEnd?170:150);ctx.textAlign='center';
  ctx.fillStyle=c;ctx.font='bold 40px sans-serif';ctx.fillText(t,W/2,250);ctx.fillStyle='#ddd';ctx.font='18px sans-serif';ctx.fillText(s||'',W/2,290);
  
  if(isMatchEnd) {
    ctx.fillStyle='#ffd54f';ctx.fillRect(W/2-180,310,160,35);
    ctx.fillStyle='#e57373';ctx.fillRect(W/2+20,310,160,35);
    ctx.fillStyle='#000';ctx.font='bold 15px sans-serif';ctx.fillText('再戦 [Enter]',W/2-100,333);ctx.fillText('ロビーへ [Esc]',W/2+100,333);
  }
}

function draw(){
  ctx.fillStyle='#10131a';ctx.fillRect(0,0,W,H);
  if(!inGame||!D)return;
  view();topbar();
  if(D.s==='count')overlay(String(Math.ceil(D.t)),(D.att===slot?'あなたは攻撃側(A)':'あなたは追越側(B)')+(D.rd>=6?'  SUDDEN DEATH':''),'#ffd54f');
  if(D.s==='result'){const w=D.hist?D.hist[D.hist.length-1]:-1;overlay(D.msg,D.sub+(w===slot?'  (あなたの得点)':''),'#7fff7f');}
  if(D.s==='match')overlay(D.msg,D.sub,'#ffd54f');
  if(D.s==='play'&&D.el<1.5){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.fillText('GO!',W/2,300);}
}

let lt=performance.now();
(function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;sync(dt);draw();requestAnimationFrame(loop);})(lt);
</script></body></html>
